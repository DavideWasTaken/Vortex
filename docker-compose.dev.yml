services:
  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant/Dockerfile
    image: vortex-qdrant:1.14.1-health
    # Qdrant is private to the Compose network, including in development.
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      VORTEX_DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vortex_data:/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
  vortex_data:
