<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Vortex</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/tailwind.css" />
    <link rel="stylesheet" href="/styles.css?v=20260524-20" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-950 antialiased">
    <section id="login-screen" class="grid min-h-screen place-items-center px-5 py-10">
      <div class="w-full max-w-md">
        <div class="mb-7 flex items-center justify-center gap-3">
          <img class="h-12 w-12 rounded-2xl shadow-lg" src="/vortex-icon.svg" alt="" />
          <div>
            <h1 class="text-2xl font-semibold tracking-tight">Vortex</h1>
            <p class="text-sm text-slate-500" data-i18n="login.subtitle">Archivio intelligente locale</p>
          </div>
        </div>

        <form id="login-form" class="rounded-3xl border border-white/70 bg-white/90 p-6 shadow-soft backdrop-blur">
          <div class="mb-6">
            <p class="mb-2 text-xs font-semibold uppercase tracking-[0.18em] text-vortex" data-i18n="login.eyebrow">Accesso</p>
            <h2 class="text-xl font-semibold tracking-tight" data-i18n="login.title">Entra nel workspace</h2>
          </div>

          <label class="mb-4 block text-sm font-medium text-slate-700">
            Username
            <input
              id="login-username"
              class="mt-2 h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-slate-950 outline-none transition focus:border-vortex focus:ring-4 focus:ring-teal-100"
              autocomplete="username"
              required
            />
          </label>

          <label class="mb-5 block text-sm font-medium text-slate-700">
            Password
            <input
              id="login-password"
              class="mt-2 h-11 w-full rounded-xl border border-slate-200 bg-white px-3 text-slate-950 outline-none transition focus:border-vortex focus:ring-4 focus:ring-teal-100"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>

          <button class="h-11 w-full rounded-xl bg-slate-950 font-semibold text-white transition hover:bg-vortex" type="submit" data-i18n="login.submit">
            Accedi
          </button>

          <p id="login-status" class="mt-4 min-h-5 text-sm text-slate-500"></p>
        </form>
      </div>
    </section>

    <section id="app-screen" class="hidden min-h-screen">
      <aside id="sidebar" class="app-sidebar fixed inset-y-0 left-0 z-20 hidden border-r border-slate-200 bg-white/90 p-5 shadow-sm backdrop-blur xl:flex xl:flex-col">
        <div class="mb-6 flex items-center justify-between gap-3">
          <div class="brand-lockup flex min-w-0 items-center gap-3">
          <img class="h-11 w-11 rounded-2xl shadow-md" src="/vortex-icon.svg" alt="" />
          <div class="sidebar-label min-w-0">
            <h1 class="text-xl font-semibold tracking-tight">Vortex</h1>
            <p class="text-sm text-slate-500" data-i18n="brand.subtitle">Il tuo archivio intelligente</p>
          </div>
          </div>
          <button id="sidebar-toggle" class="sidebar-toggle rounded-xl border border-slate-200 bg-white p-2 text-slate-600 shadow-sm transition hover:bg-slate-50" type="button" aria-label="Chiudi barra laterale" data-i18n-aria="sidebar.close">
            <svg class="sidebar-toggle-icon h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <nav class="grid gap-2">
          <button class="nav-button active" data-view="search" type="button" title="Search">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="m21 21-4.2-4.2" />
                <circle cx="11" cy="11" r="6.5" />
              </svg>
            </span>
            <span class="sidebar-label" data-i18n="nav.search">Ricerca</span>
          </button>
          <button class="nav-button" data-view="archive" type="button" title="Project Archive">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H10l2 2h5.5A2.5 2.5 0 0 1 20 9.5v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z" />
              </svg>
            </span>
            <span class="sidebar-label" data-i18n="nav.archive">Archivio progetti</span>
          </button>
          <button class="nav-button admin-nav hidden" data-view="create" type="button" title="Create Project">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 5v14" />
                <path d="M5 12h14" />
              </svg>
            </span>
            <span class="sidebar-label" data-i18n="nav.create">Crea progetto</span>
          </button>
          <button class="nav-button admin-nav hidden" data-view="admin" type="button" title="Accounts">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.5" />
                <path d="M5 19c1.2-3.2 3.5-5 7-5s5.8 1.8 7 5" />
              </svg>
            </span>
            <span class="sidebar-label" data-i18n="nav.accounts">Account</span>
          </button>
        </nav>
      </aside>

      <main id="app-main" class="app-main min-h-screen">
        <header class="sticky top-0 z-10 border-b border-slate-200 bg-slate-100/85 px-5 py-4 backdrop-blur">
          <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 xl:justify-end">
            <div class="flex items-center gap-3 xl:hidden">
              <img class="h-10 w-10 rounded-2xl" src="/vortex-icon.svg" alt="" />
              <div>
                <h1 class="font-semibold tracking-tight">Vortex</h1>
                <p class="text-xs text-slate-500" data-i18n="brand.mobileSubtitle">Archivio locale</p>
              </div>
            </div>

            <h2 id="view-title" class="sr-only">Ricerca progetti</h2>

            <div class="flex items-center gap-3">
              <div id="language-switch" class="flex h-10 items-center rounded-xl border border-slate-200 bg-white p-1 text-xs font-bold text-slate-600 shadow-sm">
                <button class="language-button active" data-language="it" type="button">
                  <span class="mini-flag flag-it" aria-hidden="true"></span>
                  IT
                </button>
                <button class="language-button" data-language="en" type="button">
                  <span class="mini-flag flag-en" aria-hidden="true"></span>
                  EN
                </button>
              </div>
              <div id="session-badge" class="flex h-10 items-center rounded-xl border border-slate-200 bg-white px-4 text-sm font-semibold text-slate-700 shadow-sm">
                <span id="session-username">-</span>
                <span id="session-role" class="ml-1 text-slate-500"></span>
              </div>
              <button id="logout-button" class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-slate-300 hover:bg-slate-50" type="button">
                <span data-i18n="session.logout">Esci</span>
              </button>
            </div>
          </div>
        </header>

        <div class="mx-auto grid max-w-6xl gap-5 px-5 py-6">
          <nav class="grid grid-cols-2 gap-2 rounded-3xl border border-white bg-white p-2 shadow-soft sm:grid-cols-4 xl:hidden">
            <button class="nav-button active justify-center" data-view="search" type="button" data-i18n="nav.search">Ricerca</button>
            <button class="nav-button justify-center" data-view="archive" type="button" data-i18n="nav.archive">Archivio progetti</button>
            <button class="nav-button admin-nav hidden justify-center" data-view="create" type="button" data-i18n="nav.create">Crea progetto</button>
            <button class="nav-button admin-nav hidden justify-center" data-view="admin" type="button" data-i18n="nav.accounts">Account</button>
          </nav>

          <section id="search-view" class="grid gap-5">
            <form id="search-form" class="rounded-3xl border border-white bg-white p-3 shadow-soft">
              <div class="grid gap-3 md:grid-cols-[1fr_110px]">
                <input
                  id="search-query"
                  class="h-12 rounded-2xl border border-slate-200 bg-slate-50 px-4 text-slate-950 outline-none transition focus:border-vortex focus:bg-white focus:ring-4 focus:ring-teal-100"
                  type="search"
                  placeholder="Cerca per caratteristiche..."
                  data-i18n-placeholder="search.placeholder"
                  autocomplete="off"
                />
                <button class="h-12 rounded-2xl bg-slate-950 font-semibold text-white transition hover:bg-vortex" type="submit" data-i18n="search.submit">
                  Cerca
                </button>
              </div>
            </form>

            <section id="results-panel" class="hidden rounded-3xl border border-white bg-white p-5 shadow-soft">
              <div class="mb-4 flex items-center justify-between gap-3">
                <div>
                  <p class="text-xs font-semibold uppercase tracking-[0.18em] text-vortex" data-i18n="results.eyebrow">Risultati</p>
                  <h3 id="results-summary" class="mt-1 font-semibold tracking-tight" aria-live="polite"></h3>
                </div>
              </div>
              <div id="results" class="min-h-80"></div>
            </section>
          </section>

          <section id="create-view" class="hidden space-y-5">
            <form class="upload-form admin-only hidden rounded-3xl border border-white bg-white p-5 shadow-soft">
              <div class="mb-4">
                <p class="text-xs font-semibold uppercase tracking-[0.18em] text-vortex" data-i18n="projects.eyebrow">Progetti</p>
                <h2 class="mt-1 text-lg font-semibold tracking-tight" data-i18n="projects.uploadTitle">Carica progetto</h2>
              </div>

              <div class="grid gap-3 md:grid-cols-2">
                <label class="block text-sm font-medium text-slate-700">
                  <span data-i18n="projects.name">Nome</span>
                  <input name="title" class="field mt-2" type="text" placeholder="Es. Showroom Milano" data-i18n-placeholder="projects.namePlaceholder" required />
                </label>

                <label class="block text-sm font-medium text-slate-700">
                  <span data-i18n="projects.files">File</span>
                  <input name="files" class="field mt-2 h-auto py-2" type="file" multiple required />
                </label>
              </div>

              <label class="mt-3 block text-sm font-medium text-slate-700">
                <span data-i18n="projects.notes">Note</span>
                <textarea name="description" class="field mt-2 min-h-20 py-2" rows="3" placeholder="Cliente, contesto, materiali" data-i18n-placeholder="projects.notesPlaceholder"></textarea>
              </label>

              <div class="mt-4 flex flex-wrap items-center gap-3">
                <button class="primary-button h-10 px-5" type="submit" data-i18n="projects.uploadSubmit">
                  Carica
                </button>
                <p class="upload-status min-h-5 text-sm text-slate-500"></p>
              </div>
            </form>
          </section>

          <section id="archive-view" class="hidden space-y-5">
            <section class="rounded-3xl border border-white bg-white p-5 shadow-soft">
              <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
                <div>
                  <p class="text-xs font-semibold uppercase tracking-[0.18em] text-vortex" data-i18n="projects.archive">Archivio</p>
                  <h3 class="mt-1 text-lg font-semibold tracking-tight" data-i18n="nav.archive">Archivio progetti</h3>
                </div>
                <p id="project-count" class="text-sm text-slate-500">0 elementi</p>
              </div>
              <div class="archive-filter mb-4">
                <span class="archive-filter-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="6.5"/>
                    <path d="m21 21-4.2-4.2"/>
                  </svg>
                </span>
                <input
                  id="archive-filter"
                  class="archive-filter-input"
                  type="search"
                  placeholder="Cerca per nome progetto..."
                  data-i18n-placeholder="archive.filterPlaceholder"
                  autocomplete="off"
                />
                <button id="archive-filter-clear" class="archive-filter-clear hidden" type="button" aria-label="Cancella ricerca" data-i18n-aria="archive.filterClear">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 6l12 12"/><path d="M18 6l-12 12"/>
                  </svg>
                </button>
              </div>
              <div id="projects-list" class="grid gap-2"></div>
            </section>
          </section>

          <section id="admin-view" class="hidden space-y-5">
            <form id="user-form" class="rounded-3xl border border-white bg-white p-5 shadow-soft">
              <div class="mb-4 flex items-center gap-3">
                <span class="grid h-10 w-10 place-items-center rounded-2xl bg-teal-50 text-vortex" aria-hidden="true">
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="8" r="3.5"/>
                    <path d="M3.5 19c1.2-3.2 3.3-5 6.5-5 1.3 0 2.5.3 3.5.9"/>
                    <path d="M17 14v6"/><path d="M14 17h6"/>
                  </svg>
                </span>
                <div>
                  <p class="text-xs font-semibold uppercase tracking-[0.18em] text-vortex" data-i18n="accounts.eyebrow">Account</p>
                  <h3 class="text-lg font-semibold tracking-tight" data-i18n="accounts.createTitle">Crea utente</h3>
                </div>
              </div>
              <div class="grid gap-3 md:grid-cols-[1fr_1fr_140px_140px]">
                <input id="new-username" class="field" placeholder="username" data-i18n-placeholder="accounts.username" required />
                <input id="new-password" class="field" placeholder="password" data-i18n-placeholder="accounts.password" type="password" required />
                <select id="new-role" class="field">
                  <option value="user">user</option>
                  <option value="admin">admin</option>
                </select>
                <button class="inline-flex h-11 items-center justify-center gap-2 rounded-xl bg-slate-950 font-semibold text-white transition hover:bg-vortex" type="submit">
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 5v14"/><path d="M5 12h14"/>
                  </svg>
                  <span data-i18n="accounts.createSubmit">Crea</span>
                </button>
              </div>
              <p id="user-form-status" class="mt-3 min-h-5 text-sm text-slate-500"></p>
            </form>

            <section class="rounded-3xl border border-white bg-white p-5 shadow-soft">
              <div class="mb-4 flex items-center justify-between gap-3">
                <div>
                  <p class="text-xs font-semibold uppercase tracking-[0.18em] text-vortex" data-i18n="accounts.access">Accessi</p>
                  <h3 class="mt-1 text-lg font-semibold tracking-tight" data-i18n="accounts.management">Gestione utenti</h3>
                </div>
              </div>
              <div id="users-list" class="grid gap-3"></div>
            </section>
          </section>
        </div>
      </main>
    </section>

    <section id="project-detail" class="project-detail-overlay hidden"></section>

    <div id="confirm-modal" class="confirm-modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
      <div class="confirm-modal-backdrop" data-confirm-action="cancel"></div>
      <div class="confirm-modal-card" role="document">
        <div class="confirm-modal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 9v4"/>
            <path d="M12 17h.01"/>
            <path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
          </svg>
        </div>
        <h3 id="confirm-modal-title" class="confirm-modal-title"></h3>
        <p id="confirm-modal-message" class="confirm-modal-message"></p>
        <div class="confirm-modal-actions">
          <button id="confirm-modal-cancel" class="confirm-modal-button confirm-modal-button-cancel" type="button" data-confirm-action="cancel"></button>
          <button id="confirm-modal-accept" class="confirm-modal-button confirm-modal-button-accept" type="button" data-confirm-action="accept"></button>
        </div>
      </div>
    </div>

    <script src="/app.js?v=20260524-24"></script>
  </body>
</html>
